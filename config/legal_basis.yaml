# Stage phrases used by classify.py to infer investigation_stage -- collapsed
# to 4 stages per user request (simpler than spec section 8's 9-stage model).
# Order matters: later stages override earlier ones when a document matches
# more than one (most-advanced-stage wins). "Điều tra" covers reviews of an
# EXISTING order (administrative/sunset/changed-circumstances review, scope
# or tariff modification) -- distinct from "Khởi xướng", which covers a fresh
# case being opened (signal, petition, initiation).
stage_phrases:
  "Khởi xướng":
    - industry pressure
    - domestic producer complaint
    - petition filed
    - request for
    - investigation initiated
    - initiation of investigation
    - notice of initiation
  "Điều tra":
    - administrative review
    - sunset review
    - changed circumstances review
    - scope modification
    - tariff modification
  "Sơ bộ":
    - preliminary determination
    - preliminary affirmative
    - preliminary negative
    - proposed remedy
    - proposed action
    - proposed tariff
  "Cuối cùng":
    - final determination
    - final affirmative
    - final action
    - antidumping duty order
    - countervailing duty order
    - order effective
    - tariff effective
    - terminated
    - withdrawn
    - revoked
